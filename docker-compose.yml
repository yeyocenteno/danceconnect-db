version: '3.8'

services:
  # app:             <-- Pon un # al inicio de estas líneas
  #   build: .
  #   ports:
  #     - "5000:5000"
  # ----------------------------------------------------
  # 1. MySQL MAESTRO (Servidor Principal de Escritura)
  # ----------------------------------------------------
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: danceconnect_db
      MYSQL_USER: dance_user
      MYSQL_PASSWORD: dance_password
    ports:
      - "3306:3306"
    command: >
      --server-id=1 
      --log-bin=mysql-bin 
      --binlog-do-db=danceconnect_db
    volumes:
      - master_data:/var/lib/mysql
    networks:
      - dance_network

  # ----------------------------------------------------
  # 2. MySQL ESCLAVO (Servidor Secundario de Réplica)
  # ----------------------------------------------------
  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306" # Expuesto en el puerto 3307 para no chocar con el maestro
    command: >
      --server-id=2 
      --read-only=1
    volumes:
      - slave_data:/var/lib/mysql
    depends_on:
      - mysql-master
    networks:
      - dance_network

  # ----------------------------------------------------
  # 3. APACHE CASSANDRA (Base de datos NoSQL)
  # ----------------------------------------------------
  cassandra:
    image: cassandra:latest
    container_name: cassandra-node
    environment:
      CASSANDRA_CLUSTER_NAME: "DanceConnectCluster"
    ports:
      - "9042:9042" # Puerto por defecto de Cassandra
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - dance_network

  # ----------------------------------------------------
  # 4. GRAFANA (Dashboard de Gráficas)
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - mysql-slave
    networks:
      - dance_network

# Definición de volúmenes persistentes
volumes:
  master_data:
  slave_data:
  cassandra_data:

# Red interna para que los contenedores se comuniquen
networks:
  dance_network:
    driver: bridge
